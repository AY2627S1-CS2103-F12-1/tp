plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.address.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def javaFxPlatform
if (osName.contains('win')) {
    javaFxPlatform = 'win'
} else if (osName.contains('mac')) {
    javaFxPlatform = architecture == 'aarch64' ? 'mac-aarch64' : 'mac'
} else if (osName.contains('linux')) {
    javaFxPlatform = architecture == 'aarch64' ? 'linux-aarch64' : 'linux'
} else {
    throw new GradleException("Unsupported operating system for JavaFX: ${osName}")
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()
    // CI runners have no display, so run JavaFX headless there via Monocle. Locally, use the normal
    // toolkit: JDKs that bundle JavaFX (e.g. Zulu "fx") cannot load Monocle from the classpath.
    if (System.getenv('CI')) {
        systemProperty 'glass.platform', 'Monocle'
        systemProperty 'monocle.platform', 'Headless'
        systemProperty 'prism.order', 'sw'
        systemProperty 'java.awt.headless', 'true'
    }
    // Keep matching JavaFX natives for tests without narrowing the release jar.
    classpath = classpath.filter { file ->
        !(file.name ==~ /javafx-.+-(win|mac|linux)(-aarch64)?\.jar/) ||
                file.name.endsWith("-${javaFxPlatform}.jar")
    }
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    for (String platform : ['win', 'mac', 'linux']) {
        implementation "org.openjfx:javafx-base:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-controls:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-fxml:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${platform}"
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testRuntimeOnly 'org.testfx:openjfx-monocle:17.0.10'
    testRuntimeOnly "org.openjfx:javafx-base:${javaFxVersion}:${javaFxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-controls:${javaFxVersion}:${javaFxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}"
}

shadowJar {
    archiveFileName = 'addressbook.jar'
}

defaultTasks 'clean', 'test'
